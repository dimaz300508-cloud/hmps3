<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.4" />
    </filter>
    <path id="textArcTop" d="M 105,250 A 145,145 0 0,1 395,250" fill="none" />
    <path id="textArcBottom" d="M 385,250 A 135,135 0 0,1 115,250" fill="none" />
  </defs>

  <g filter="url(#logoShadow)">
    {/* 8 Curved Sawtooth / Bucket-Wheel Gear Blades */}
    <g transform="rotate(0 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>
    <g transform="rotate(45 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>
    <g transform="rotate(90 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>
    <g transform="rotate(135 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>
    <g transform="rotate(180 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>
    <g transform="rotate(225 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>
    <g transform="rotate(270 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>
    <g transform="rotate(315 250 250)"><path d="M 250,75 C 275,60 305,50 335,45 C 315,90 285,120 250,135 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="2.5" stroke-linejoin="round" /></g>

    {/* Outer Red Ring */}
    <circle cx="250" cy="250" r="168" fill="none" stroke="#DC2626" stroke-width="6" />

    {/* Blue Ribbon Ring */}
    <circle cx="250" cy="250" r="156" fill="#8BE0E8" stroke="#0284C7" stroke-width="3.5" />

    {/* Inner Green Field */}
    <circle cx="250" cy="250" r="120" fill="#9ADE43" stroke="#15803D" stroke-width="3" />

    {/* Arched Text: TEKNIK PERTAMBANGAN BATUBARA */}
    <text fill="#0F172A" font-size="17" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2.5px">
      <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
        TEKNIK PERTAMBANGAN BATUBARA
      </textPath>
    </text>

    {/* Arched Text: MATARATU */}
    <text fill="#0F172A" font-size="22" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="4px">
      <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
        MATARATU
      </textPath>
    </text>

    {/* Masked Mining Excavator & Coal Bed */}
    <g clip-path="url(#innerCircleClip)">
      <clipPath id="innerCircleClip">
        <circle cx="250" cy="250" r="118" />
      </clipPath>

      {/* Coal layer */}
      <rect x="130" y="312" width="240" height="60" fill="#111827" />

      {/* Machine track */}
      <rect x="195" y="290" width="110" height="18" rx="9" fill="#DC2626" stroke="#7F1D1D" stroke-width="2" />

      {/* TPB Shovel Outline */}
      <path d="M 235,160 L 300,160 C 320,160 330,172 330,188 C 330,202 320,212 305,214 C 322,216 332,228 332,246 C 332,266 318,278 295,278 L 260,278 L 260,215 L 245,215 L 245,278 L 225,278 L 225,215 L 185,240 L 170,225 L 215,188 L 215,160 Z" fill="#E11D48" stroke="#9F1239" stroke-width="3.5" stroke-linejoin="round" />
      <rect x="272" y="172" width="28" height="26" rx="4" fill="#9ADE43" stroke="#9F1239" stroke-width="2.5" />
      <rect x="272" y="226" width="30" height="34" rx="4" fill="#9ADE43" stroke="#9F1239" stroke-width="2.5" />
      <polygon points="195,225 215,198 215,225" fill="#9ADE43" stroke="#9F1239" stroke-width="2" />
    </g>
  </g>
</svg>
